          "defaultValue": {
            "boolValue": true
          }
        }
        ```
        Then besides that the default served value is set to `true`, all the Targeting Rules are deleted.
        So we get a response like this:
        ```json
        {
          "defaultValue": {
            "boolValue": true
          },
          "targetingRules": []
        }
        ```
