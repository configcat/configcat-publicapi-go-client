          description: When the replace was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Replace Flag
      tags:
      - Feature Flags & Settings
