            schema:
              $ref: "#/components/schemas/WebHookRequestModel"
          application/*+json:
            schema:
              $ref: "#/components/schemas/WebHookRequestModel"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponseModel"
          description: When the replace was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Replace Webhook
      tags:
      - Webhooks
