        style: simple
      responses:
        "204":
          description: When the delete was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Delete Webhook
      tags:
      - Webhooks
    get:
      description: "This endpoint returns the metadata of a Webhook \nidentified by\
        \ the `webhookId`."
      operationId: get-webhook
      parameters:
      - description: The identifier of the Webhook.
        explode: false
        in: path
        name: webhookId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponseModel"
          description: "When everything is ok, the webhook data is returned."
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Get Webhook
      tags:
      - Webhooks
    patch:
      description: "This endpoint updates a Webhook identified by the `webhookId`\
        \ parameter with a collection of [JSON Patch](https://jsonpatch.com) operations.\n\
        \nThe advantage of using JSON Patch is that you can describe individual update\
        \ operations on a resource without touching attributes that you don't want\
        \ to change.\n\nFor example: We have the following resource.\n```json\n{\n\
        \  \"webhookId\": 6,\n  \"url\": \"https://example.com/hook\",\n  \"httpMethod\"\
        : \"post\",\n  \"content\": \"null\",\n  \"webHookHeaders\": []\n}\n```\n\
        If we send an update request body as below (it changes the `content` field\
        \ and adds a new HTTP header):\n```json\n[\n  {\n    \"op\": \"replace\",\
        \ \n    \"path\": \"/content\", \n    \"value\": \"Some webhook content.\"\
        \n  }, \n  {\n    \"op\": \"add\", \n    \"path\": \"/webHookHeaders/-\",\
        \ \n    \"value\": {\n      \"key\": \"X-Custom-Header\", \n      \"value\"\
        : \"Custom header value\"\n    }\n  }\n]\n```\nOnly the `content` and `webHookHeaders`\
        \ are updated and all the other attributes remain unchanged.\nSo we get a\
        \ response like this:\n```json\n{\n  \"webhookId\": 6,\n  \"url\": \"https://example.com/hook\"\
        ,\n  \"httpMethod\": \"post\", \n  \"content\": \"Some webhook content.\"\
        , \n  \"webHookHeaders\": [\n    {\n      \"key\": \"X-Custom-Header\", \n\
        \      \"value\": \"Custom header value\", \n      \"isSecure\": false\n \
        \   }\n  ]\n}\n```"
      operationId: update-webhook
      parameters:
      - description: The identifier of the Webhook.
        explode: false
        in: path
        name: webhookId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          text/json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          application/*+json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponseModel"
          description: When the update was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Update Webhook
      tags:
      - Webhooks
    put:
      description: |-
        This endpoint replaces the whole value of a Webhook identified by the `webhookId` parameter.

        **Important:** As this endpoint is doing a complete replace, it's important to set every other attribute that you don't
        want to change in its original state. Not listing one means it will reset.
      operationId: replace-webhook
      parameters:
      - description: The identifier of the Webhook.
        explode: false
