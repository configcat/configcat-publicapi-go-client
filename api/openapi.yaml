          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Delete Flag
      tags:
      - Feature Flags & Settings
    get:
      description: "This endpoint returns the metadata attributes of a Feature Flag\
        \ or Setting \nidentified by the `settingId` parameter."
      operationId: get-setting
      parameters:
      - description: The identifier of the Setting.
        explode: false
        in: path
        name: settingId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingModel"
          description: "When everything is ok, the setting data returned."
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Get Flag
      tags:
      - Feature Flags & Settings
    patch:
      description: "This endpoint updates the metadata of a Feature Flag or Setting\
        \ \nwith a collection of [JSON Patch](https://jsonpatch.com) operations in\
        \ a specified Config.\n\nOnly the `name`, `hint` and `tags` attributes are\
        \ modifiable by this endpoint.\nThe `tags` attribute is a simple collection\
        \ of the [tag IDs](#operation/get-tags) attached to the given setting.\n\n\
        The advantage of using JSON Patch is that you can describe individual update\
        \ operations on a resource\nwithout touching attributes that you don't want\
        \ to change.\n\nFor example: We have the following resource.\n```json\n{\n\
        \  \"settingId\": 5345,\n  \"key\": \"myGrandFeature\",\n  \"name\": \"Tihs\
        \ is a naem with soem typos.\",\n  \"hint\": \"This flag controls my grandioso\
        \ feature.\",\n  \"settingType\": \"boolean\",\n  \"tags\": [\n    {\n   \
        \   \"tagId\": 0, \n      \"name\": \"sample tag\", \n      \"color\": \"\
        whale\"\n    }\n  ]\n}\n```\nIf we send an update request body as below (it\
        \ changes the `name` and adds the already existing tag with the id `2`):\n\
        ```json\n[\n  {\n    \"op\": \"replace\", \n    \"path\": \"/name\", \n  \
        \  \"value\": \"This is the name without typos.\"\n  }, \n  {\n    \"op\"\
        : \"add\", \n    \"path\": \"/tags/-\", \n    \"value\": 2\n  }\n]\n```\n\
        Only the `name` and `tags` are updated and all the other attributes remain\
        \ unchanged.\nSo we get a response like this:\n```json\n{\n  \"settingId\"\
        : 5345, \n  \"key\": \"myGrandFeature\", \n  \"name\": \"This is the name\
        \ without typos.\", \n  \"hint\": \"This flag controls my grandioso feature.\"\
        , \n  \"settingType\": \"boolean\", \n  \"tags\": [\n    {\n      \"tagId\"\
        : 0, \n      \"name\": \"sample tag\", \n      \"color\": \"whale\"\n    },\
        \ \n    {\n      \"tagId\": 2, \n      \"name\": \"another tag\", \n     \
        \ \"color\": \"koala\"\n    }\n  ]\n}\n```"
      operationId: update-setting
      parameters:
      - description: The identifier of the Setting.
        explode: false
        in: path
        name: settingId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          text/json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          application/*+json:
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingModel"
          description: When the update was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Update Flag
      tags:
      - Feature Flags & Settings
    put:
      description: "This endpoint replaces the whole value of a Feature Flag or Setting\n\
        identified by the `settingId` parameter.\n\n**Important:** As this endpoint\
        \ is doing a complete replace, it's important to set every other attribute\
        \ that you don't \nwant to change in its original state. Not listing one means\
        \ it will reset."
      operationId: replace-setting
      parameters:
      - description: The identifier of the Setting.
        explode: false
