openapi: 3.0.4
info:
  contact:
    email: support@configcat.com
    name: ConfigCat
    url: https://configcat.com
  description: "The purpose of this API is to access the ConfigCat platform programmatically.\n\
    You can **Create**, **Read**, **Update** and **Delete** any entities like **Feature\
    \ Flags, Configs, Environments** or **Products** within ConfigCat.\n\n**Base API\
    \ URL**: https://api.configcat.com\n\nIf you prefer the swagger documentation,\
    \ you can find it here: [Swagger UI](https://api.configcat.com/swagger).\n\nThe\
    \ API is based on HTTP REST, uses resource-oriented URLs, status codes and supports\
    \ JSON \nformat. \n\n**Important:** Do not use this API for accessing and evaluating\
    \ feature flag values. Use the [SDKs](https://configcat.com/docs/sdk-reference/overview)\
    \ or the [ConfigCat Proxy](https://configcat.com/docs/advanced/proxy/proxy-overview/)\
    \ instead.\n\n# OpenAPI Specification\n\nThe complete specification is publicly\
    \ available in the following formats: \n- [OpenAPI v3](https://api.configcat.com/docs/v1/swagger.json)\n\
    - [Swagger v2](https://api.configcat.com/docs/v1/swagger.v2.json)\n\nYou can use\
    \ it to generate client libraries in various languages with [OpenAPI Generator](https://github.com/OpenAPITools/openapi-generator)\
    \ or\n[Swagger Codegen](https://swagger.io/tools/swagger-codegen/) to interact\
    \ with this API.\n\n# Authentication\nThis API uses the [Basic HTTP Authentication\
    \ Scheme](https://en.wikipedia.org/wiki/Basic_access_authentication). \n\n<!--\
    \ ReDoc-Inject: <security-definitions> -->\n\n# Throttling and rate limits\nAll\
    \ the rate limited API calls are returning information about the current rate\
    \ limit period in the following HTTP headers:\n\n| Header | Description |\n| :-\
    \ | :- |\n| X-Rate-Limit-Remaining | The maximum number of requests remaining\
    \ in the current rate limit period. |\n| X-Rate-Limit-Reset     | The time\twhen\
    \ the current rate limit period resets.\t\t\t\t\t\t  |\n\nWhen the rate limit\
    \ is exceeded by a request, the API returns with a `HTTP 429 - Too many requests`\
    \ status along with a `Retry-After` HTTP header.\n"
  termsOfService: https://configcat.com/policies
  title: ConfigCat Public Management API
  version: v1
  x-logo:
    url: https://api.configcat.com/resources/configcat-logo-horiz.svg
servers:
- url: https://api.configcat.com
security:
- Basic: []
tags:
- description: |-
    <i>These endpoints are exclusive for <a target="_blank" rel="noopener noreferrer" href="https://configcat.com/docs/advanced/config-v2/"><b>Config V2</b></a> Feature Flags.</i>
    <br /><i>They can only be used on a Config that has `evaluationVersion` set to `v2`.</i><br /><br />
    With these endpoints you can control how your existing Feature Flags and Settings should serve their values.
    You can turn Feature Flags on or off, update Setting values and change Targeting Rules.

    These endpoints are determining the Environment and Config by the <a target="_blank" rel="noopener noreferrer" href="https://app.configcat.com/sdkkey">SDK key</a> passed in
    the `X-CONFIGCAT-SDKKEY` request header. To identify the desired Feature Flag or Setting to change,
    you can use either its `settingId` or `key` attribute. You can get those attributes
    from the [Feature Flag & Setting](#tag/Feature-Flags-and-Settings) endpoints.
  name: Feature Flag & Setting values using SDK Key V2
- description: |-
    <i>These endpoints are exclusive for <a target="_blank" rel="noopener noreferrer" href="https://configcat.com/docs/advanced/config-v2/"><b>Config V2</b></a> Feature Flags.</i>
    <br /><i>They can only be used on a Config that has `evaluationVersion` set to `v2`.</i><br /><br />
    With these endpoints you can control how your existing Feature Flags and Settings should serve their values.
    You can turn Feature Flags on or off, update Setting values and change Targeting Rules.

    To determine which Feature Flag or Setting you want to work with you have to pass its `settingId`. It can be
    obtained from the [Feature Flag & Setting](#tag/Feature-Flags-and-Settings) endpoints.

    You also have to specify in which Environment you want to change the served value configuration by its
    `environmentId` which can be obtained from the [List Environments](#operation/get-environments) endpoint.
  name: Feature Flag & Setting values V2
- description: |-
    Propose, review, and apply changes to Settings in a controlled workflow.

    A _change request_ is a set of changes to Settings that you prepare without publishing them right away.
    You can propose changes for later manual publishing, or schedule it to be applied automatically at a specific time.
    This supports the four-eyes principle, because another person can review and approve the change before it reaches production.

    **Beta feature:** Approval Flow and Scheduled Changes are in closed beta. You can join the beta by contacting support. We are collecting feedback from real-world use to improve the experience.
  name: Change Requests (Approval flow & Scheduled changes) - Beta
- description: "With these endpoints you can control how your existing Feature Flags\
    \ and Settings should serve their values. \nYou can turn Feature Flags on or off,\
    \ update Setting values and also add, remove or change the order of Percentage\
    \ and Targeting Rules.\n\nThese endpoints are determining the Environment and\
    \ Config by the <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://app.configcat.com/sdkkey\"\
    >SDK key</a> passed in\nthe `X-CONFIGCAT-SDKKEY` request header. To identify the\
    \ desired Feature Flag or Setting to change, \nyou can use either its `settingId`\
    \ or `key` attribute. You can get those attributes \nfrom the [Feature Flag &\
    \ Setting](#tag/Feature-Flags-and-Settings) endpoints."
  name: Feature Flag & Setting values using SDK Key
- description: "With these endpoints you can control how your existing Feature Flags\
    \ and Settings should serve their values. \nYou can turn Feature Flags on or off,\
    \ update Setting values and also add, remove or reorder Percentage and Targeting\
    \ Rules.\n\nTo determine which Feature Flag or Setting you want to work with you\
    \ have to pass its `settingId`. It can be\nobtained from the [Feature Flag & Setting](#tag/Feature-Flags-and-Settings)\
    \ endpoints.\n\nYou also have to specify in which Environment you want to change\
    \ the served value configuration by its\n`environmentId` which can be obtained\
    \ from the [List Environments](#operation/get-environments) endpoint."
  name: Feature Flag & Setting values
- description: "With these endpoints you can manage your Feature Flags or Settings\
    \ within a Config. \nHowever you can't use them for manipulating the values of\
    \ your Feature Flags and Settings,\nto do that please visit the [Feature Flag\
    \ & Setting values using SDK Key](#tag/Feature-Flag-and-Setting-values-using-SDK-Key)\n\
    and [Feature Flag & Setting values](#tag/Feature-Flag-and-Setting-values) sections\
    \ of the API.\n\nFor using these endpoints, first you have to select which Config\
    \ you want to work with by its `configId` \nwhich can be obtained from the [List\
    \ Configs](#operation/get-configs) endpoint. \nThen you can use it to create new\
    \ Feature Flags or to get information about existing ones.\n\nThen you can obtain\
    \ the `settingId` or `key` of your desired Feature Flag or Setting \nto use them\
    \ for further operations in this API. \n\n<a href=\"https://configcat.com/docs/main-concepts/#setting\"\
    \ target=\"_blank\" rel=\"noopener noreferrer\">Here</a> you can read more about\
    \ the concept of Settings."
  name: Feature Flags & Settings
- description: |-
    With these endpoints you can get useful information about your Organizations.
    This also can be used to manage your [Products](#tag/Products).

    <a href="https://configcat.com/docs/organization/" target="_blank" rel="noopener noreferrer">Here</a> you can read more about the Organizations.
  name: Organizations
- description: |-
    With these endpoints you can manage your Members.

    <a href="https://configcat.com/docs/advanced/team-management/team-management-basics" target="_blank" rel="noopener noreferrer">Here</a> you can read more about Team Management.
  name: Members
- description: |-
    With these endpoints you can manage your Permission Groups.

    <a href="https://configcat.com/docs/advanced/team-management/team-management-basics" target="_blank" rel="noopener noreferrer">Here</a> you can read more about Permissions.
  name: Permission Groups
- description: |-
    With these endpoints you can manage your Products.
    By gathering the right `productId`, you can also manage [Environments](#tag/Environments), [Configs](#tag/Configs), [Tags](#tag/Tags), [Webhooks](#tag/Webhooks), and [Permission Groups](#tag/Permission-Groups) through the API.

    <a href="https://configcat.com/docs/main-concepts/#product" target="_blank" rel="noopener noreferrer">Here</a> you can read more about the concept of Products.
  name: Products
- description: |-
    With these endpoints you can manage Webhooks.

    <a href="https://configcat.com/docs/advanced/notifications-webhooks" target="_blank" rel="noopener noreferrer">Here</a> you can read more about the concept of Webhooks.
  name: Webhooks
- description: "With these endpoints you can manage your Configs.\nThis also can be\
    \ used to manage [Feature Flags and Settings](#tag/Feature-Flags-and-Settings)\
    \ and their \n[served values](#tag/Feature-Flag-and-Setting-values) through this\
    \ API.\n\n<a href=\"https://configcat.com/docs/main-concepts/#config\" target=\"\
    _blank\" rel=\"noopener noreferrer\">Here</a> you can read more about the concept\
    \ of Configs."
  name: Configs
- description: "With these endpoints you can update existing Environments or add new\
    \ ones into your selected [Product](#tag/Products). \n\n<a href=\"https://configcat.com/docs/main-concepts/#environment\"\
    \ target=\"_blank\" rel=\"noopener noreferrer\">Here</a> you can read more about\
    \ the concept of Environments."
  name: Environments
- description: |-
    With these endpoints you can manage your Segments.
    Segments allow you to group your users based on any of their properties. Define user segments and add them to multiple feature flags.
  name: Segments
- description: With these endpoints you can manage your SDK Keys.
  name: SDK Keys
- description: "With these endpoints you can manage Tags. Tags are stored under a\
    \ Product. You can  and add a Tag to a Feature Flag or Setting using the [Update\
    \ Flag](#operation/update-setting) endpoint."
  name: Tags
- description: |-
    With these endpoints you can manage your Integrations.

    - <a href="https://configcat.com/docs/integrations/datadog/" target="_blank" rel="noopener noreferrer">Datadog</a>
    - <a href="https://configcat.com/docs/integrations/slack/" target="_blank" rel="noopener noreferrer">Slack</a>
    - <a href="https://configcat.com/docs/integrations/amplitude/" target="_blank" rel="noopener noreferrer">Amplitude</a>
    - <a href="https://configcat.com/docs/integrations/mixpanel/" target="_blank" rel="noopener noreferrer">MixPanel</a>
    - <a href="https://configcat.com/docs/integrations/segment/" target="_blank" rel="noopener noreferrer">Segment</a>
    - PubNub (work in progress)
  name: Integrations
- description: With these endpoints you can manage your integration links.
  name: Integration links
- description: Access audit log entries.
  name: Audit logs
- description: List Zombie (stale) flags
  name: Zombie (stale) flags
- description: Information about the current user.
  name: Me
- description: |-
    With this endpoint you can upload Feature Flag and Setting usage references that will be shown on the ConfigCat Dashboard.

    <a href="https://configcat.com/docs/advanced/code-references/overview/" target="_blank" rel="noopener noreferrer">Here</a> you can read more about the concept of Code References.
  name: Code References
- description: |-
    With these endpoints you can manage your Organization's Proxy Profiles.

    <a href="https://configcat.com/docs/advanced/proxy/proxy-overview/#1-automatic-configuration-with-proxy-profiles" target="_blank" rel="noopener noreferrer">Here</a> you can read more about Proxy Profiles.
  name: Proxy Profiles
paths:
  /v2/change-requests/{changeRequestId}:
    get:
      description: Returns the details of a specific Change Request.
      operationId: get-change-request
      parameters:
      - description: The identifier of the Change Request.
        explode: false
        in: path
        name: changeRequestId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestModel"
          description: ""
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Get Change Request
      tags:
      - Change Requests (Approval flow & Scheduled changes) - Beta
    put:
      description: "Updates the metadata of a Change Request, such as title, note,\
        \ schedule, etc."
      operationId: update-change-request
      parameters:
      - description: The identifier of the Change Request.
        explode: false
        in: path
        name: changeRequestId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChangeRequestModel"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateChangeRequestModel"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateChangeRequestModel"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestModel"
          description: When the update was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Update Change Request
      tags:
      - Change Requests (Approval flow & Scheduled changes) - Beta
  /v1/proxy-profiles/{proxyProfileId}:
    delete:
      description: This endpoint removes a Proxy Profile identified by the `proxyProfileId`
        parameter.
      operationId: delete-proxy-profile
      parameters:
      - description: The identifier of the Proxy Profile.
        explode: false
        in: path
        name: proxyProfileId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: When the delete was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Delete Proxy Profile
      tags:
      - Proxy Profiles
    get:
      description: "This endpoint returns a Proxy Profile \nidentified by the `proxyProfileId`."
      operationId: get-proxy-profile
      parameters:
      - description: The identifier of the Proxy Profile.
        explode: false
        in: path
        name: proxyProfileId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyProfileModel"
          description: "When everything is ok, the Proxy Profile is returned."
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Get Proxy Profile
      tags:
      - Proxy Profiles
    patch:
      description: "This endpoint updates a Proxy Profile identified by the `proxyProfileId`\
        \ parameter with a collection of [JSON Patch](https://jsonpatch.com) operations.\n\
        \nThe advantage of using JSON Patch is that you can describe individual update\
        \ operations on a resource without touching attributes that you don't want\
        \ to change.\n\nFor example: We have the following resource.\n```json\n{\n\
        \  \"proxyProfileId\": \"4ebe288d-6415-44a8-85c8-7b9f78316a86\",\n  \"name\"\
        : \"production\",\n  \"description\": \"profile for production environments\"\
        ,\n  \"lastAccessedAt\": \"2019-08-24T14:15:22Z\",\n  \"connectionPreferences\"\
        : {\n    \"sdkPollInterval\": 60,\n    \"webhookNotification\": null\n  },\n\
        \  \"sdkKeySelectionRules\": []\n}\n```\nIf we send an update request body\
        \ as below (it changes the `sdkPollInterval` field and adds a new Proxy Webhook\
        \ URL):\n```json\n[\n  {\n    \"op\": \"replace\", \n    \"path\": \"/connectionPreferences/sdkPollInterval\"\
        , \n    \"value\": 120\n  }, \n  {\n    \"op\": \"add\",\n    \"path\": \"\
        /connectionPreferences/webhookNotification\",\n    \"value\": {\n      \"\
        webhookProxyUrl\": \"https://my-proxy-url.com\"\n    }\n  }\n]\n```\nOnly\
        \ the `sdkPollInterval` and `webhookProxyUrl` are updated and all the other\
        \ attributes remain unchanged.\nSo we get a response like this:\n```json\n\
        {\n  \"proxyProfileId\": \"4ebe288d-6415-44a8-85c8-7b9f78316a86\",\n  \"name\"\
        : \"production\",\n  \"description\": \"profile for production environments\"\
        ,\n  \"lastAccessedAt\": \"2019-08-24T14:15:22Z\",\n  \"connectionPreferences\"\
        : {\n    \"sdkPollInterval\": 120,\n    \"webhookNotification\": {\n     \
        \ \"webhookProxyUrl\": \"https://my-proxy-url.com\",\n      \"signingKey1\"\
        : \"<generated-signing-key>\",\n      \"signingKey2\": null\n    }\n  },\n\
        \  \"sdkKeySelectionRules\": []\n}\n```"
      operationId: update-proxy-profile
      parameters:
      - description: The identifier of the Proxy Profile.
        explode: false
        in: path
        name: proxyProfileId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              add SDK key selection rule:
                description: This example adds a selection rule to your proxy profile
                  that includes all current and future environments that has `Prod`
                  in its name.
                value:
                - op: add
                  path: /sdkKeySelectionRules/-
                  value:
                    environmentNameMatchFilter: '*Prod*'
              change the SDK poll interval:
                description: This example changes the SDK poll interval to 120 seconds.
                value:
                - op: replace
                  path: /connectionPreferences/sdkPollInterval
                  value: 120
              set webhook url:
                description: This example sets the Proxy webhook URL.
                value:
                - op: add
                  path: /connectionPreferences/webhookNotification
                  value:
                    webhookProxyUrl: https://my-proxy-url.com
              disconnect Proxy from receiving notifications:
                description: This example disconnects a Proxy from receiving notifications.
                value:
                - op: remove
                  path: /connectionPreferences/webhookNotification
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          text/json:
            examples:
              add SDK key selection rule:
                description: This example adds a selection rule to your proxy profile
                  that includes all current and future environments that has `Prod`
                  in its name.
                value:
                - op: add
                  path: /sdkKeySelectionRules/-
                  value:
                    environmentNameMatchFilter: '*Prod*'
              change the SDK poll interval:
                description: This example changes the SDK poll interval to 120 seconds.
                value:
                - op: replace
                  path: /connectionPreferences/sdkPollInterval
                  value: 120
              set webhook url:
                description: This example sets the Proxy webhook URL.
                value:
                - op: add
                  path: /connectionPreferences/webhookNotification
                  value:
                    webhookProxyUrl: https://my-proxy-url.com
              disconnect Proxy from receiving notifications:
                description: This example disconnects a Proxy from receiving notifications.
                value:
                - op: remove
                  path: /connectionPreferences/webhookNotification
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
          application/*+json:
            examples:
              add SDK key selection rule:
                description: This example adds a selection rule to your proxy profile
                  that includes all current and future environments that has `Prod`
                  in its name.
                value:
                - op: add
                  path: /sdkKeySelectionRules/-
                  value:
                    environmentNameMatchFilter: '*Prod*'
              change the SDK poll interval:
                description: This example changes the SDK poll interval to 120 seconds.
                value:
                - op: replace
                  path: /connectionPreferences/sdkPollInterval
                  value: 120
              set webhook url:
                description: This example sets the Proxy webhook URL.
                value:
                - op: add
                  path: /connectionPreferences/webhookNotification
                  value:
                    webhookProxyUrl: https://my-proxy-url.com
              disconnect Proxy from receiving notifications:
                description: This example disconnects a Proxy from receiving notifications.
                value:
                - op: remove
                  path: /connectionPreferences/webhookNotification
            schema:
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyProfileModel"
          description: When the update was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Update Proxy Profile
      tags:
      - Proxy Profiles
    put:
      description: |-
        This endpoint replaces a Proxy Profile identified by the `proxyProfileId` parameter.

        **Important:** As this endpoint is doing a complete replace, it's important to set every other attribute that you don't
        want to change in its original state. Not listing one means it will reset.
      operationId: replace-proxy-profile
      parameters:
      - description: The identifier of the Proxy Profile.
        explode: false
        in: path
        name: proxyProfileId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrUpdateProxyProfileRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateOrUpdateProxyProfileRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateOrUpdateProxyProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyProfileModel"
          description: When the replace was successful.
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: Replace Proxy Profile
      tags:
      - Proxy Profiles
  /v2/products/{productId}/change-requests:
    get:
      description: Returns Change Requests of a Product with optional filtering and
        pagination.
      operationId: get-change-requests
      parameters:
      - description: The identifier of the Product.
        explode: false
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Filter Change Requests by Config identifier.
        explode: true
        in: query
        name: configId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter Change Requests by Environment identifier.
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter Change Requests by Setting identifier.
        explode: true
        in: query
        name: settingId
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Filter Change Requests by status values.
        explode: true
        in: query
        name: changeRequestStatusFilter
        required: false
        schema:
          items:
            $ref: "#/components/schemas/ChangeRequestStatus"
          type: array
        style: form
      - description: Filter Change Requests by schedule state.
        explode: true
        in: query
        name: scheduleFilter
        required: false
        schema:
          $ref: "#/components/schemas/ChangeRequestScheduleFilter"
        style: form
      - description: Filter Change Requests by approval requirement.
        explode: true
        in: query
        name: approveRequiredFilter
        required: false
        schema:
          $ref: "#/components/schemas/ChangeRequestApproveRequiredFilter"
        style: form
      - description: Filter Change Requests by whether they need attention.
        explode: true
        in: query
        name: needsAttentionFilter
        required: false
        schema:
          $ref: "#/components/schemas/NeedsAttentionFilter"
        style: form
      - description: "Page number (min: 1)."
        explode: true
        in: query
        name: pageNumber
        required: false
        schema:
          default: 1
          format: int32
          maximum: 2147483647
          minimum: 1
          type: integer
        style: form
      - description: "Page size (min: 1, max: 100)."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestsModel"
          description: ""
        "400":
          description: Bad request.
        "404":
          description: Not found.
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: List Change Requests
      tags:
      - Change Requests (Approval flow & Scheduled changes) - Beta
  /v1/organizations:
    get:
      description: This endpoint returns the list of the Organizations that belongs
        to the user.
      operationId: get-organizations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationModel"
                type: array
          description: ""
        "429":
          description: Too many requests. In case of the request rate exceeds the
            rate limits.
      summary: List Organizations
      tags:
      - Organizations
  /v1/products:
    get:
      description: This endpoint returns the list of the Products that belongs to
        the user.
      operationId: get-products
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
